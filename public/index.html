<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPS Control Panel - CyberPunk</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-tertiary: #1a1a24;
            --bg-card: #151520;
            --border: #2a2a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #8888aa;
            --accent: #00ff41;
            --accent-dark: #00cc33;
            --danger: #ff4444;
            --warning: #ffaa00;
            --info: #00aaff;
            --success: #00ff41;
            --glow: 0 0 10px rgba(0, 255, 65, 0.3);
            --glass: rgba(21, 21, 32, 0.95);
            --sidebar-width: 220px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.03;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 65, 0.1) 2px, rgba(0, 255, 65, 0.1) 4px);
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #111118 100%);
            padding: 20px;
        }

        .login-box {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--glow);
            backdrop-filter: blur(10px);
        }

        .login-box h1 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            text-shadow: var(--glow);
        }

        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent);
            font-size: 12px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--accent);
            font-family: 'Courier New', monospace;
            border-radius: 5px;
            font-size: 14px;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .btn {
            padding: 12px 24px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-family: 'Courier New', monospace;
            border-radius: 5px;
            transition: all 0.3s;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: var(--glow);
        }
        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }
        .btn-warning {
            border-color: var(--warning);
            color: var(--warning);
        }
        .btn-info {
            border-color: var(--info);
            color: var(--info);
        }
        .btn-primary {
            width: 100%;
            margin-top: 10px;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 11px;
        }
        .btn-xs {
            padding: 3px 8px;
            font-size: 10px;
        }

        .error-msg {
            color: var(--danger);
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            min-height: 20px;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-bar .title {
            color: var(--accent);
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }
        .top-bar .stats {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .top-bar .stats span {
            white-space: nowrap;
        }

        .main-content {
            display: flex;
            height: calc(100vh - 52px);
            position: relative;
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,65,0.4);
            align-items: center;
            justify-content: center;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 10px 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 999;
        }
        .sidebar .nav-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 2px solid transparent;
            color: var(--text-secondary);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .sidebar .nav-item:hover,
        .sidebar .nav-item.active {
            background: var(--bg-tertiary);
            color: var(--accent);
            border-left-color: var(--accent);
        }
        .sidebar .nav-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .content-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg-primary);
            -webkit-overflow-scrolling: touch;
        }

        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }
        .card h3 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 13px;
        }
        .card .value {
            font-size: 20px;
            color: var(--text-primary);
        }
        .card .subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Gauges */
        .gauge {
            width: 100%;
            height: 16px;
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
            margin: 8px 0;
        }
        .gauge-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent));
            transition: width 0.5s ease;
            border-radius: 8px;
            position: relative;
        }
        .gauge-fill.warning {
            background: linear-gradient(90deg, var(--warning), #ffcc00);
        }
        .gauge-fill.danger {
            background: linear-gradient(90deg, #ff4444, var(--danger));
        }

        /* Tables */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 15px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            font-size: 11px;
            min-width: 600px;
        }
        .data-table th {
            background: var(--bg-tertiary);
            color: var(--accent);
            padding: 10px 8px;
            text-align: left;
            font-size: 10px;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        .data-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .data-table tr:hover {
            background: var(--bg-tertiary);
        }

        /* Terminal */
        .terminal-container {
            background: #000000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--accent);
            white-space: pre-wrap;
            margin-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .terminal-input-line {
            display: flex;
            gap: 5px;
            color: var(--accent);
            align-items: center;
        }
        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        /* File Manager */
        .file-path {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 12px;
            margin-bottom: 12px;
            border-radius: 5px;
            color: var(--accent);
            font-size: 12px;
            word-break: break-all;
        }
        .file-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            color: var(--accent);
            margin-bottom: 15px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 6px;
            animation: slideIn 0.3s ease;
            font-size: 12px;
            max-width: 300px;
            word-break: break-word;
        }
        .toast.success {
            border-left: 3px solid var(--success);
        }
        .toast.error {
            border-left: 3px solid var(--danger);
        }
        .toast.warning {
            border-left: 3px solid var(--warning);
        }
        .toast.info {
            border-left: 3px solid var(--info);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Badges */
        .badge {
            padding: 2px 7px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
        }
        .badge-success {
            background: rgba(0,255,65,0.2);
            color: var(--success);
        }
        .badge-danger {
            background: rgba(255,68,68,0.2);
            color: var(--danger);
        }
        .badge-warning {
            background: rgba(255,170,0,0.2);
            color: var(--warning);
        }
        .badge-info {
            background: rgba(0,170,255,0.2);
            color: var(--info);
        }

        /* Log Viewer */
        .log-viewer {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 11px;
            color: var(--accent);
            white-space: pre-wrap;
            -webkit-overflow-scrolling: touch;
        }

        /* Search/Filter */
        .search-box {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 12px;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            font-size: 12px;
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--bg-card);
            color: var(--accent);
            border-bottom-color: var(--bg-card);
        }
        .tab:hover {
            color: var(--accent);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h2 {
            color: var(--accent);
            font-size: 18px;
            white-space: nowrap;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
                box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            }
            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.7);
                z-index: 998;
            }
            .sidebar-overlay.open {
                display: block;
            }

            .main-content {
                margin-left: 0;
            }

            .card-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .card .value {
                font-size: 16px;
            }

            .data-table {
                font-size: 10px;
                min-width: 500px;
            }
            .data-table th, .data-table td {
                padding: 6px 4px;
            }

            .top-bar {
                padding: 6px 10px;
                gap: 5px;
            }
            .top-bar .title {
                font-size: 14px;
            }
            .top-bar .stats {
                font-size: 10px;
                gap: 8px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 12px;
            }

            .terminal-container {
                height: 350px;
            }

            .modal-content {
                max-width: 95%;
                padding: 15px;
            }

            .section-header h2 {
                font-size: 15px;
            }

            .file-actions {
                gap: 5px;
            }
            .file-actions .btn {
                padding: 5px 10px;
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 20px;
            }
            .login-box h1 {
                font-size: 18px;
            }

            .top-bar .title {
                font-size: 12px;
            }
            .top-bar .stats {
                font-size: 9px;
                gap: 5px;
            }

            .card {
                padding: 10px;
            }
            .card h3 {
                font-size: 11px;
            }
            .card .value {
                font-size: 14px;
            }

            .data-table {
                min-width: 400px;
                font-size: 9px;
            }

            .terminal-container {
                height: 300px;
            }

            .toast {
                max-width: 250px;
                font-size: 11px;
                padding: 10px 14px;
            }

            .tabs {
                gap: 1px;
            }
            .tab {
                padding: 6px 10px;
                font-size: 10px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dark);
        }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>

    <!-- Mobile Menu Toggle -->
    <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰</button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>⚡ VPS CONTROL PANEL</h1>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="admin" autocomplete="username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" onclick="login()">LOGIN</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="top-bar">
            <div class="title">⚡ VPS PANEL v2.0</div>
            <div class="stats">
                <span id="topCpu">CPU: --</span>
                <span id="topRam">RAM: --</span>
                <span id="topDisk">DISK: --</span>
                <span id="topUptime">UP: --</span>
                <button class="btn btn-sm" onclick="logout()">LOGOUT</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar" id="sidebar">
                <div class="nav-item active" data-section="overview"><span class="nav-icon">📊</span> Overview</div>
                <div class="nav-item" data-section="monitoring"><span class="nav-icon">📈</span> Monitoring</div>
                <div class="nav-item" data-section="processes"><span class="nav-icon">⚙️</span> Processes</div>
                <div class="nav-item" data-section="apps"><span class="nav-icon">📦</span> Apps (PM2)</div>
                <div class="nav-item" data-section="docker"><span class="nav-icon">🐳</span> Docker</div>
                <div class="nav-item" data-section="services"><span class="nav-icon">🔧</span> Services</div>
                <div class="nav-item" data-section="nginx"><span class="nav-icon">🌐</span> Nginx</div>
                <div class="nav-item" data-section="terminal"><span class="nav-icon">💻</span> Terminal</div>
                <div class="nav-item" data-section="files"><span class="nav-icon">📁</span> Files</div>
                <div class="nav-item" data-section="logs"><span class="nav-icon">📋</span> Logs</div>
                <div class="nav-item" data-section="network"><span class="nav-icon">🌍</span> Network</div>
                <div class="nav-item" data-section="firewall"><span class="nav-icon">🔥</span> Firewall</div>
                <div class="nav-item" data-section="security"><span class="nav-icon">🔒</span> Security</div>
                <div class="nav-item" data-section="backups"><span class="nav-icon">💾</span> Backups</div>
                <div class="nav-item" data-section="power"><span class="nav-icon">⚡</span> Power</div>
                <div class="nav-item" data-section="users"><span class="nav-icon">👥</span> Users</div>
            </div>

            <div class="content-area" id="contentArea">
                <div class="section active" id="section-overview"></div>
                <div class="section" id="section-monitoring"></div>
                <div class="section" id="section-processes"></div>
                <div class="section" id="section-apps"></div>
                <div class="section" id="section-docker"></div>
                <div class="section" id="section-services"></div>
                <div class="section" id="section-nginx"></div>
                <div class="section" id="section-terminal"></div>
                <div class="section" id="section-files"></div>
                <div class="section" id="section-logs"></div>
                <div class="section" id="section-network"></div>
                <div class="section" id="section-firewall"></div>
                <div class="section" id="section-security"></div>
                <div class="section" id="section-backups"></div>
                <div class="section" id="section-power"></div>
                <div class="section" id="section-users"></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // STATE MANAGEMENT
        // ============================================================
        const STATE = {
            currentSection: 'overview',
            ws: null,
            terminalSessionId: null,
            currentFilePath: '/',
            csrfToken: '',
            metricsHistory: [],
            maxMetricsHistory: 60,
            autoRefreshIntervals: {}
        };

        // ============================================================
        // INITIALIZATION
        // ============================================================
        async function init() {
            try {
                const status = await apiCall('/api/auth/status');
                if (status.authenticated) {
                    showDashboard();
                }
            } catch {
                // Not authenticated, show login
            }
        }

        // ============================================================
        // SIDEBAR TOGGLE (MOBILE)
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.contains('open');
            
            sidebar.classList.toggle('open', !isOpen);
            overlay.classList.toggle('open', !isOpen);
            
            const toggle = document.getElementById('menuToggle');
            toggle.textContent = isOpen ? '☰' : '✕';
        }

        // ============================================================
        // API CALLS
        // ============================================================
        async function apiCall(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'CSRF-Token': STATE.csrfToken
                },
                credentials: 'same-origin'
            };
            if (body && method !== 'GET') {
                options.body = JSON.stringify(body);
            }

            const response = await fetch(endpoint, options);
            const data = await response.json();

            if (!response.ok) {
                if (response.status === 401) {
                    hideDashboard();
                    throw new Error('Session expired. Please login again.');
                }
                throw new Error(data.error || `Request failed (${response.status})`);
            }
            return data;
        }

        // ============================================================
        // WEBSOCKET
        // ============================================================
        function connectWebSocket() {
            if (STATE.ws && STATE.ws.readyState === WebSocket.OPEN) return;
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            STATE.ws = new WebSocket(`${protocol}//${window.location.host}`);

            STATE.ws.onopen = () => {
                console.log('WebSocket connected');
            };

            STATE.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'metrics') {
                        updateMetrics(data);
                        updateMetricsHistory(data);
                    } else if (data.type === 'terminal') {
                        handleTerminalData(data);
                    }
                } catch (e) {
                    console.error('WS message parse error:', e);
                }
            };

            STATE.ws.onclose = () => {
                console.log('WebSocket disconnected, reconnecting...');
                setTimeout(connectWebSocket, 5000);
            };

            STATE.ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function drawMonitoringCharts() {
            if (STATE.metricsHistory.length < 2) return;

            drawChart('cpuChart', history.map(h => h.cpu), 'CPU %', '#00ff41');

        function drawChart(canvasId, data, label, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.parentElement.clientWidth - 10;
            const height = 200;
            
            canvas.width = width;
            canvas.height = height;
            
            if (data.length < 2) return;
            
            // Clear
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            // Grid lines
            ctx.strokeStyle = '#1a1a2a';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                const y = (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Draw line
            const maxVal = Math.max(...data, 100);
            const stepX = width / (data.length - 1);
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowColor = color;
            ctx.shadowBlur = 5;
            ctx.beginPath();
            
            data.forEach((val, i) => {
                const x = i * stepX;
                const y = height - (val / maxVal) * height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Labels
            ctx.fillStyle = '#888';
            ctx.font = '10px monospace';
            ctx.fillText(label, 5, 15);
            ctx.fillText(maxVal.toFixed(0) + '%', 5, height - 5);
            ctx.fillText('0%', 5, height - 15);
        }

            if (STATE.ws && STATE.ws.readyState === WebSocket.OPEN) {
                STATE.ws.send(JSON.stringify({
                    type: 'terminal',

                }));

        function handleTerminalKey(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('terminalInput');
                if (!input) return;
                
                const command = input.value;
                input.value = '';

                const output = document.getElementById('terminalOutput');
                if (output) {
                    output.innerHTML += `<div style="color:#fff;">$ ${escapeHtml(command)}</div>`;
                }

                if (STATE.ws && STATE.ws.readyState === WebSocket.OPEN && STATE.terminalSessionId) {
                    STATE.ws.send(JSON.stringify({
                        type: 'terminal',
                        sessionId: STATE.terminalSessionId,
                        data: command + '\n'
                    }));
                }
            }
        }

        function handleTerminalData(data) {
            if (data.action === 'ready') {
                STATE.terminalSessionId = data.sessionId;
                return;
            }
            
            if (data.sessionId === STATE.terminalSessionId) {
                const output = document.getElementById('terminalOutput');
                if (output) {
                    output.innerHTML += escapeHtml(data.data);
                    output.scrollTop = output.scrollHeight;
                }
            }
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('path', STATE.currentFilePath);
            
            try {
                const response = await fetch('/api/files/upload', {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin',
                    headers: { 'CSRF-Token': STATE.csrfToken }
                });
                const data = await response.json();
                if (data.success) {
                    showToast('Uploaded: ' + data.filename, 'success');
                    loadFiles(STATE.currentFilePath);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                showToast('Upload failed: ' + error.message, 'error');
            }
            
            input.value = '';
        }

                document.getElementById('section-users').innerHTML = html;
            } catch (error) {
                document.getElementById('section-users').innerHTML = `
                    <div class="section-header"><h2>👥 User Management</h2></div>
                    <div class="empty-state">Admin access required</div>
                `;
            }
        }

        function showAddUserModal() {
            showModal('Add User', `
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="newUsername" placeholder="username" style="width:100%;">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="newPassword" placeholder="password" style="width:100%;">
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <select id="newRole" style="width:100%;background:var(--bg-primary);color:var(--accent);border:1px solid var(--border);padding:8px;">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button class="btn" onclick="addUser()">Create User</button>
                <button class="btn" onclick="closeModal()" style="margin-left:8px;">Cancel</button>
            `);
        }

        async function addUser() {
            const username = document.getElementById('newUsername')?.value.trim();
            const password = document.getElementById('newPassword')?.value;
            const role = document.getElementById('newRole')?.value;
            
            if (!username || !password) {
                showToast('Username and password required', 'warning');
                return;
            }
            
            try {
                await apiCall('/api/auth/users', 'POST', { username, password, role });
                showToast('User created', 'success');
                closeModal();
                loadUsers();
            } catch (error) {
                showToast('Failed: ' + error.message, 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Delete user "${username}"?`)) return;
            try {
                await apiCall(`/api/auth/users/${encodeURIComponent(username)}`, 'DELETE');
                showToast('User deleted', 'success');
                loadUsers();
            } catch (error) {
                showToast('Failed: ' + error.message, 'error');
            }
        }

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttr(str) {
            return escapeHtml(str).replace(/"/g, '&quot;');
        }

        function formatUptime(seconds) {
            if (!seconds || seconds < 0) return '0m';
            seconds = Math.floor(seconds);
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const parts = [];
            if (d > 0) parts.push(`${d}d`);
            if (h > 0) parts.push(`${h}h`);
            parts.push(`${m}m`);
            return parts.join(' ');
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showModal(title, content) {
            // Remove existing modals
            document.querySelectorAll('.modal').forEach(m => m.remove());
            
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.onclick = function(e) {
                if (e.target === modal) closeModal();
            };
            modal.innerHTML = `
                <div class="modal-content">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                        <h3 style="margin:0;">${title}</h3>
                        <button class="btn btn-xs" onclick="closeModal()" style="font-size:16px;">✕</button>
                    </div>
                    ${content}
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => m.remove());
        }

        // Handle Enter key on login
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
                login();
            }
        });

        // Handle escape key for modals
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Handle window resize for charts
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (STATE.currentSection === 'monitoring') {
                    drawMonitoringCharts();
                }
            }, 250);
        });

        // Initialize
        init();
    </script>
</body>
</html>
